name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modularize:
    name: Materialize modular frontend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Detect pending modularization
        id: generate
        run: |
          if [ -f scripts/modularize_app.py ]; then echo "pending=true" >> "$GITHUB_OUTPUT"; else echo "pending=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install frontend dependencies
        if: steps.generate.outputs.pending == 'true'
        working-directory: frontend
        run: |
          npm install -g npm@9.2.0
          npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
      - name: Generate modular source tree
        if: steps.generate.outputs.pending == 'true'
        run: |
          node scripts/prepare_modularizer.mjs
          python scripts/modularize_app.py
      - name: Validate generated frontend
        if: steps.generate.outputs.pending == 'true'
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          CI: "false"
        run: npm run build
      - name: Commit validated source tree
        if: steps.generate.outputs.pending == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: complete frontend feature modularization"
          git push origin HEAD:${{ github.head_ref }}

  pr-title:
    name: Validasi judul PR (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Tes backend (FastAPI + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Instal dependensi
        run: pip install -r backend/requirements-ci.txt
      - name: Nyalakan API uji
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: titikjiwa_ci
          ADMIN_EMAIL: admin@titikjiwa.id
          ADMIN_PASSWORD: titikjiwaAdmin123!
          JWT_SECRET: ci-secret-key
          FRONTEND_URL: http://localhost:3000
        run: |
          python -m uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/titikjiwa-api.log 2>&1 &
          API_PID=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/ > /dev/null; then ready=1; break; fi
            if ! kill -0 "$API_PID" 2>/dev/null; then cat /tmp/titikjiwa-api.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/titikjiwa-api.log; exit 1; fi
      - name: Jalankan pytest
        env:
          TEST_BASE_URL: http://localhost:8001
          ADMIN_EMAIL: admin@titikjiwa.id
          ADMIN_PASSWORD: titikjiwaAdmin123!
        run: pytest backend/tests -v

  frontend:
    name: Build frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instal dependensi
        working-directory: frontend
        run: |
          npm install -g npm@9.2.0
          npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
      - name: Build produksi
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          CI: "false"
        run: npm run build
