name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pr-title:
    name: Validasi judul PR (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Tes backend (FastAPI + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instal dependensi
        run: |
          pip install -r backend/requirements-ci.txt
      - name: Nyalakan API uji
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: titikjiwa_ci
          ADMIN_EMAIL: admin@titikjiwa.id
          ADMIN_PASSWORD: titikjiwaAdmin123!
          JWT_SECRET: ci-secret-key
          FRONTEND_URL: http://localhost:3000
        run: |
          python -m uvicorn server:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 30); do curl -sf http://localhost:8001/api/ > /dev/null && break || sleep 2; done
      - name: Jalankan pytest
        env:
          TEST_BASE_URL: http://localhost:8001
        run: pytest backend/tests -v

  frontend:
    name: Build frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instal dependensi
        working-directory: frontend
        run: |
          npm install -g npm@9.2.0
          npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
      - name: Build produksi
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          CI: "false"
        run: npm run build
