name: Modularize application

on:
  push:
    branches:
      - refactor/journal-community-features

permissions:
  contents: write

jobs:
  modularize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/journal-community-features
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate modular application
        run: python scripts/modularize_app.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build
      - name: Run backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Commit validated modularization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "refactor: complete frontend feature modularization"
          git push origin HEAD:refactor/journal-community-features
